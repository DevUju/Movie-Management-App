<div class="favorites-container">
  <h2>Your Favorites</h2>

  <div *ngIf="favorites.length === 0" class="empty-message">
    You have no favorites yet.
  </div>

  <div class="favorites-list" *ngIf="favorites.length > 0">
    <div class="favorite-card" *ngFor="let item of favorites">
      <div class="favorite-info">
        <h3>{{ item.title }}</h3>
        <p>{{ item.description | slice:0:100 }}...</p>
      </div>
      <button class="remove-btn" (click)="remove(item.id)">Remove</button>
    </div>
  </div>
</div>
