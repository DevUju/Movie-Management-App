<div class="detail-container" *ngIf="movie as m">
	<button class="back-btn" (click)="goBack()">← Back</button>

	<div class="detail-grid">
		<img class="detail-poster" [src]="'https://image.tmdb.org/t/p/w500' + m.poster_path" [alt]="m.original_title" />

		<div class="detail-info">
			<h2>{{ m.original_title }}</h2>
			<p class="rating">⭐ {{ m.vote_average }}</p>
			<p class="release">Release: {{ m.release_date }}</p>
			<p class="overview">{{ m.overview }}</p>

			<div class="detail-actions">
				<button class="fav-btn" (click)="addToFavorites(m)">❤️ Add to Favorites</button>
			</div>
		</div>
	</div>
</div>
