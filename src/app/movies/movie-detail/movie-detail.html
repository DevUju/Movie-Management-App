<div style="padding: 2rem; text-align: center;">
	<p *ngIf="!movie && !errorMessage" style="color: #999; margin: 2rem 0;">{{ loadingMessage }}</p>
	<p *ngIf="errorMessage" style="color: #d9534f; background: #f8d7da; padding: 1rem; border-radius: 4px; max-width: 600px; margin: 1rem auto; line-height: 1.5;">{{ errorMessage }}</p>
</div>

<div class="detail-container" *ngIf="movie as m">
	<button class="back-btn" (click)="goBack()">← Back</button>

	<div class="detail-grid">
		<img class="detail-poster" [src]="'https://image.tmdb.org/t/p/w500' + m.poster_path" [alt]="m.original_title" />

		<div class="detail-info">
			<h2>{{ m.original_title }}</h2>
			<p class="rating">⭐ {{ m.vote_average }}</p>
			<p class="release">Release: {{ m.release_date }}</p>
			<p class="overview">{{ m.overview }}</p>

			<!-- <div class="detail-actions">
				<button class="fav-btn" (click)="addToFavorites(m)" [disabled]="addedToFavorites">
					<span *ngIf="!addedToFavorites">❤️ Add to Favorites</span>
					<span *ngIf="addedToFavorites">✅ Added</span>
				</button>
			</div> -->
		</div>
	</div>
</div>
