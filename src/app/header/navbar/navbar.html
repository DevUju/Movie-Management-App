<header class="navbar">
    <div class="navbar-container">

        <div class="search-section">
            <app-search (searchQuery)="onSearchNav($event)"></app-search>
        </div>

        <div class="favorites-section">
            <a routerLink="/favorites" class="favorites-link">
                <span class="favorites-icon">❤️</span>
                <span class="favorites-count" *ngIf="favouriteCounter$ | async as count">{{ count }}</span>
            </a>
        </div>  
    </div>
</header>
